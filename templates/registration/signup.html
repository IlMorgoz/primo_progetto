{% extends "base.html" %}
{% load crispy_forms_filters %}
{% load crispy_forms_tags %}
{%block title%} {{block.super}} Reset {%endblock title%}
{% block content %}
    <h2>Registrazione</h2>
    <form method="post">
        {% csrf_token %}
        {{form|crispy}}

        <button type="submit">Registrati</button>
    </form>
    <p>
        Hai gia un account?
        <a href="{% url 'login' %}">Login</a>
    </p>
{% endblock %}
