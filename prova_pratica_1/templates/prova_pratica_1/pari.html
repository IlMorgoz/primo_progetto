{% extends "base.html"%}
{%block title%} {{block.super}} Pari_Dispari {%endblock title%}
{%block content%}
<ul> 
    {% for x in array %}
        {% if x|divisibleby:2 %}
            <li><span style="color:green">{{ x }}</span></li>
        {%else%}
            <li><span style="color:red">{{ x }}</span></li>
        {%endif%}
    {% endfor %}
</ul>
<p>Numeri pari: {{pari}}<br>Numeri dispari: {{dispari}}</p>
{%endblock content%}
